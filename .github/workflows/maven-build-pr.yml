name: Maven Build PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(/bin/date -u "+%Y-%m-%dT%H:%M:%S")" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven

    - name: Build with Maven
      env:
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
      run: mvn -B install --file pom.xml -Ddependency-check.autoUpdate=false -Ddependency-check.skip=true --settings scripts/maven-ci-settings.xml

